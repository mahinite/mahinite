
name: Generate GitHub Contribution Snake

on:
  # Automatically regenerate every day
  schedule:
    - cron: "0 0 * * *"

  # Allow manual execution
  workflow_dispatch:

  # Regenerate whenever main is updated
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mahinite
          outputs: |
            dist/github-snake.svg?color_snake=%23D94551&color_dots=%23CBD5E1,%23F5D0D4,%23F09AA3,%23D94551,%239F2637
            dist/github-snake-dark.svg?color_snake=%23FF8790&color_dots=%23263449,%23405773,%237792B2,%23F07880,%23FBBF24

      - name: Publish snake animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
